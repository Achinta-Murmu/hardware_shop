name: Walkthrough screenshots

# Boots an Android emulator in the cloud, runs the robot user in
# app/src/androidTest (WalkthroughTest), and uploads a screenshot of every screen.
# Start it by hand from the Actions tab, or push a commit whose message contains [shots].

on:
  workflow_dispatch:
  push:
    branches: [android-native]

jobs:
  walkthrough:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the walkthrough on an emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p shots
            adb logcat -c || true
            adb logcat -s GALLA:I AndroidRuntime:E > shots/logcat.txt 2>&1 &
            timeout 1500 ./gradlew :app:connectedDebugAndroidTest --stacktrace || echo "TEST TASK FAILED" > test-failed.txt
            adb pull /sdcard/Download/galla-shots shots || true
            ls -la shots shots/galla-shots || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galla-walkthrough
          path: |
            shots
            app/build/reports/androidTests
            test-failed.txt
          if-no-files-found: warn
